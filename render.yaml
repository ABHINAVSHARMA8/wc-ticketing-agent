databases:
  - name: wc-ticketing-agent-db
    plan: free
    databaseName: ticketing
    user: ticketing

services:
  - type: web
    name: wc-ticketing-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wc-ticketing-agent-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: worker
    name: wc-ticketing-agent-monitor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python monitor/monitor_prices.py --loop --interval 600
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wc-ticketing-agent-db
          property: connectionString
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
